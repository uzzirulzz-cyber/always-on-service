<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal AI Model Hub</title>
    <style>
        :root {
            --bg: #090d16;
            --sidebar-bg: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --user-bubble: #2563eb;
            --bot-bubble: #1e293b;
            --active-tab: #1d4ed8;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Sidebar */
        aside {
            width: 320px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            overflow-y: auto;
        }
        aside h2 {
            font-size: 1.05rem;
            margin: 0 0 4px 0;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .provider-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .btn-provider {
            background-color: #1e293b;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s;
        }
        .btn-provider:hover, .btn-provider.active {
            background-color: var(--active-tab);
            border-color: #60a5fa;
            font-weight: 600;
        }
        .config-box {
            background: #111827;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .config-box label {
            font-size: 0.78rem;
            color: var(--text-dim);
            text-transform: uppercase;
            font-weight: 600;
        }
        select, input[type="text"], input[type="password"] {
            width: 100%;
            background: #1f2937;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }
        select:focus, input:focus {
            border-color: var(--primary);
        }
        .btn-save {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 9px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-save:hover { background-color: #059669; }

        /* Main Chat Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #0b1120;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge-live {
            background-color: #10b981;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px #10b981;
        }
        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .message.bot {
            align-self: flex-start;
            background-color: var(--bot-bubble);
            border: 1px solid var(--border);
        }
        .message.user {
            align-self: flex-end;
            background-color: var(--user-bubble);
            color: #fff;
        }
        .chat-input-bar {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            background: #0b1120;
        }
        .chat-input-bar input {
            flex: 1;
            padding: 12px 16px;
            background: #1e293b;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .chat-input-bar button {
            padding: 12px 24px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .chat-input-bar button:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>
    <aside>
        <h2>⚡ Models & Inference</h2>
        <div style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 6px;">Select provider:</div>
        <div class="provider-grid">
            <button class="btn-provider active" onclick="selectProvider('gemini')">✨ Gemini</button>
            <button class="btn-provider" onclick="selectProvider('openai')">🤖 OpenAI</button>
            <button class="btn-provider" onclick="selectProvider('claude')">🧠 Claude</button>
            <button class="btn-provider" onclick="selectProvider('qwen')">🐉 Qwen</button>
            <button class="btn-provider" onclick="selectProvider('kimi')">🌙 Kimi (Moonshot)</button>
            <button class="btn-provider" onclick="selectProvider('glm')">⚡ GLM (Zhipu)</button>
            <button class="btn-provider" onclick="selectProvider('deepseek')">🔍 DeepSeek</button>
            <button class="btn-provider" onclick="selectProvider('openrouter')">🌐 OpenRouter (All)</button>
        </div>

        <div class="config-box">
            <div>
                <label>Active Provider</label>
                <div id="display-provider" style="font-weight:bold; color:#60a5fa; margin-top:2px;">Gemini (Google)</div>
            </div>

            <div>
                <label>Model Preset</label>
                <select id="select-model" onchange="updateModelInput()"></select>
            </div>

            <div>
                <label>Custom Model Name</label>
                <input type="text" id="input-model" placeholder="Model ID...">
            </div>

            <div>
                <label>API Endpoint (Base URL)</label>
                <input type="text" id="input-base-url" placeholder="https://...">
            </div>

            <div>
                <label id="key-label">API Key</label>
                <input type="password" id="input-api-key" placeholder="Paste your API key here...">
                <div id="key-status" style="font-size: 0.72rem; color: #10b981; margin-top: 3px;"></div>
            </div>

            <button class="btn-save" onclick="saveActiveSettings()">💾 Save & Activate Model</button>
        </div>
    </aside>

    <main>
        <header>
            <div style="display:flex; align-items:center; gap:8px;">
                <span class="badge-live"></span>
                <span style="font-weight:600; font-size:1.05rem;">Universal Inference Hub (24/7 Live)</span>
            </div>
            <div id="active-info-pill" style="font-size:0.85rem; color:#38bdf8; background:#0c4a6e; padding:4px 12px; border-radius:12px;">
                Ready
            </div>
        </header>

        <div class="chat-container" id="chat">
            <div class="message bot">🚀 <b>Ready!</b> Select any model on the left (Gemini, Claude, OpenAI, Qwen, Kimi, GLM, DeepSeek, or OpenRouter), paste your API key, and hit <b>Save & Activate</b> to start chatting.</div>
        </div>

        <form class="chat-input-bar" id="chat-form">
            <input type="text" id="user-input" placeholder="Message your model..." autocomplete="off" required>
            <button type="submit">Send</button>
        </form>
    </main>

    <script>
        const providers = {
            gemini: {
                name: "Google Gemini",
                base_url: "https://generativelanguage.googleapis.com/v1beta/openai/",
                default_model: "gemini-2.0-flash",
                models: ["gemini-2.0-flash", "gemini-1.5-pro", "gemini-1.5-flash"]
            },
            openai: {
                name: "OpenAI / Codex",
                base_url: "https://api.openai.com/v1",
                default_model: "gpt-4o",
                models: ["gpt-4o", "gpt-4o-mini", "o1", "o3-mini"]
            },
            claude: {
                name: "Anthropic Claude (via OpenRouter/Proxy)",
                base_url: "https://openrouter.ai/api/v1",
                default_model: "anthropic/claude-3.5-sonnet",
                models: ["anthropic/claude-3.5-sonnet", "anthropic/claude-3.5-haiku", "anthropic/claude-3-opus"]
            },
            qwen: {
                name: "Qwen (Alibaba Cloud / DashScope)",
                base_url: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1",
                default_model: "qwen-max",
                models: ["qwen-max", "qwen-plus", "qwen-turbo", "qwen-2.5-coder-32b-instruct"]
            },
            kimi: {
                name: "Kimi (Moonshot AI)",
                base_url: "https://api.moonshot.cn/v1",
                default_model: "moonshot-v1-8k",
                models: ["moonshot-v1-8k", "moonshot-v1-32k", "moonshot-v1-128k"]
            },
            glm: {
                name: "GLM (Zhipu AI)",
                base_url: "https://open.bigmodel.cn/api/paas/v4/",
                default_model: "glm-4-plus",
                models: ["glm-4-plus", "glm-4-flash", "glm-4-air"]
            },
            deepseek: {
                name: "DeepSeek",
                base_url: "https://api.deepseek.com/v1",
                default_model: "deepseek-chat",
                models: ["deepseek-chat", "deepseek-reasoner"]
            },
            openrouter: {
                name: "OpenRouter (All Providers)",
                base_url: "https://openrouter.ai/api/v1",
                default_model: "google/gemini-2.0-flash-001",
                models: [
                    "google/gemini-2.0-flash-001",
                    "anthropic/claude-3.5-sonnet",
                    "openai/gpt-4o",
                    "qwen/qwen-2.5-coder-32b-instruct",
                    "deepseek/deepseek-r1"
                ]
            }
        };

        let currentProvider = "gemini";

        function selectProvider(key) {
            currentProvider = key;
            document.querySelectorAll('.btn-provider').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            const p = providers[key];
            document.getElementById('display-provider').textContent = p.name;
            document.getElementById('input-base-url').value = p.base_url;

            const select = document.getElementById('select-model');
            select.innerHTML = '';
            p.models.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                select.appendChild(opt);
            });
            document.getElementById('input-model').value = p.default_model;
        }

        function updateModelInput() {
            document.getElementById('input-model').value = document.getElementById('select-model').value;
        }

        async function saveActiveSettings() {
            const model = document.getElementById('input-model').value.trim();
            const base_url = document.getElementById('input-base-url').value.trim();
            const api_key = document.getElementById('input-api-key').value.trim();

            if (!api_key) {
                alert("Please paste your API key for " + providers[currentProvider].name);
                return;
            }

            try {
                const res = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        provider: currentProvider,
                        base_url: base_url,
                        model: model,
                        api_key: api_key
                    })
                });
                const data = await res.json();
                document.getElementById('active-info-pill').textContent = "Active: " + currentProvider.toUpperCase() + " (" + model + ")";
                document.getElementById('key-status').textContent = "✓ Key saved securely";
                document.getElementById('input-api-key').value = '';
                appendMessage(`✅ <b>${providers[currentProvider].name}</b> (${model}) is now activated and live! You can chat immediately below.`, 'bot');
            } catch (err) {
                alert("Error saving settings: " + err.message);
            }
        }

        const chatBox = document.getElementById('chat');
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');

        function appendMessage(text, sender) {
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            msg.innerHTML = text;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            input.value = '';

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });
                const data = await res.json();
                appendMessage(data.response || data.message || JSON.stringify(data), 'bot');
            } catch (err) {
                appendMessage('Error: ' + err.message, 'bot');
            }
        });

        // Initialize Gemini as default view
        selectProvider('gemini');
        fetch('/api/settings').then(r => r.json()).then(data => {
            if (data.model) {
                document.getElementById('active-info-pill').textContent = "Active: " + data.provider + " (" + data.model + ")";
            }
            if (data.has_api_key) {
                document.getElementById('key-status').textContent = "✓ Key present (" + data.api_key_masked + ")";
            }
        });
    </script>
</body>
</html>
