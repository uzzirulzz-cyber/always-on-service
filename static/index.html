<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI & Automation Model Interface</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --user-bubble: #2563eb;
            --bot-bubble: #1e293b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #0b1120;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            margin: 0;
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-badge {
            background-color: #10b981;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #10b981;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            overflow: hidden;
            padding: 16px;
            box-sizing: border-box;
        }
        .chat-box {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 8px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
        }
        .message.bot {
            align-self: flex-start;
            background-color: var(--bot-bg, #1e293b);
            border: 1px solid var(--border);
        }
        .message.user {
            align-self: flex-end;
            background-color: var(--user-bubble);
            color: #fff;
        }
        .input-bar {
            display: flex;
            gap: 10px;
            padding-top: 16px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: var(--primary);
        }
        button {
            padding: 12px 24px;
            background-color: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>
    <header>
        <h1><span class="status-badge"></span> 24/7 Model & Service Interface</h1>
        <span style="font-size: 0.85rem; color: var(--text-dim);" id="host-label">Connecting...</span>
    </header>

    <div class="container">
        <div class="chat-box" id="chat">
            <div class="message bot">
                👋 Hello! This is your 24/7 live service interface running in the cloud and local network. Send a prompt or command below to interact with it.
            </div>
        </div>

        <form class="input-bar" id="chat-form">
            <input type="text" id="user-input" placeholder="Type a message or instruction..." autocomplete="off" required>
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        const hostLabel = document.getElementById('host-label');
        hostLabel.textContent = window.location.origin;

        const chatBox = document.getElementById('chat');
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');

        function appendMessage(text, sender) {
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            msg.textContent = text;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            input.value = '';

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });
                const data = await res.json();
                appendMessage(data.response || data.message || JSON.stringify(data), 'bot');
            } catch (err) {
                appendMessage('Error communicating with model endpoint: ' + err.message, 'bot');
            }
        });
    </script>
</body>
</html>
