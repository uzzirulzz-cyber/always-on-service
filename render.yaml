services:
  - type: web
    name: always-on-service
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: APP_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
