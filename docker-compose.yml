services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: always_on_service
    # Keep container running 24/7 across server crashes and VPS reboots
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - app_data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  app_data:
    driver: local
